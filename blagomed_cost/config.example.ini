; Себестоимость МП — пример конфигурации.
; Скопируй этот файл в config.ini и заполни значения. config.ini в git не попадает.
; Пароль 1С хранится только в локальном config.ini.

[web]
; хост/порт веб-интерфейса и дашборда
; 127.0.0.1 — только этот компьютер (по умолчанию).
; 0.0.0.0 — доступ с другой машины по локальной сети; обязателен вход
; [auth] и не рекомендуется без VPN/HTTPS-прокси.
host = 127.0.0.1
port = 8085

[auth]
; логин для входа в веб-интерфейс.
; Пароль генерируется командой: python tools/hash_password.py <пароль> и вставляется как pass_hash
user = ЛОГИН
pass_hash = ВСТАВИТЬ_СЮДА

[1C]
; режим: com или odata
mode = com
; имя сервера 1С (как в окне запуска 1С, поле «Кластер серверов») или IP
server = server1c
; имя информационной базы на сервере (поле «Имя информационной базы»)
base = ut
; пользователь 1С (лучше отдельный, с правами только на чтение)
user = ЛОГИН
password = ПАРОЛЬ

; для режима odata:
; url_odata = http://<server>:4001/ut12/odata/standard.odata/

[Цены]
; наименование вида цен поставщика с закупочными ценами
вид_цены = Закупочная
; часть наименования поставщика (фильтр цен, как в отчёте «Условия закупок»)
поставщик = ГАВРЮШКИН

[Расчёт]
; цена ППУ за кг, руб. и наценка — заводятся на этапе 3 в БД со своей датой.
; Здесь только НАЧАЛЬНЫЕ значения для миграции.
ppu_rub_per_kg = 405
margin_pct = 0.15
alert_pct = 10