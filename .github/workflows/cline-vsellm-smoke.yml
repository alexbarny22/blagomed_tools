name: Cline VseLLM smoke pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: cline-vsellm-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check whether test PR already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --head test/cline-vsellm-issue-12 --state all --json number --jq 'length')
          if [ "$count" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "22"
      - name: Install Cline
        if: steps.check.outputs.skip == 'false'
        run: npm install -g cline@3.0.74
      - name: Run isolated Cline test
        if: steps.check.outputs.skip == 'false'
        env:
          VSELLM_API_KEY: ${{ secrets.VSELLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VSELLM_API_KEY:-}" ]; then echo "VSELLM_API_KEY not configured"; exit 1; fi
          git switch -c test/cline-vsellm-issue-12
          cline auth -p openai -b https://api.vsellm.ru/v1 -k "$VSELLM_API_KEY" -m deepseek/deepseek-v4-flash-0731
          mkdir -p automation/reports
          timeout 900 cline --yolo --json "You are completing a tightly scoped SMOKE TEST only. Create automation/smoke_test/README.md with exact marker AI_ORCHESTRATOR_SMOKE_TEST_OK and automation/smoke_test/test_marker.py containing a pytest test for that marker. Do not read secrets or modify other paths. Do not use external services. Do not modify .github or existing projects. Do not push or create a PR. End after writing the two files." > automation/reports/cline.jsonl
          python -m pip install pytest
          python -m pytest -q automation/smoke_test/test_marker.py
          python - <<'PY'
          import subprocess
          changes = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          paths = [line[3:] for line in changes]
          allowed = {'automation/smoke_test/README.md','automation/smoke_test/test_marker.py'}
          assert paths and set(paths) == allowed, f'Unexpected changed paths: {paths}'
          from pathlib import Path
          assert 'AI_ORCHESTRATOR_SMOKE_TEST_OK' in Path('automation/smoke_test/README.md').read_text()
          PY
          git add automation/smoke_test/README.md automation/smoke_test/test_marker.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "test: Cline VseLLM smoke output for issue 12"
      - name: Publish test branch and draft PR
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/test/cline-vsellm-issue-12
          gh pr create --draft --base main --head test/cline-vsellm-issue-12 --title "test: Cline + VseLLM automated smoke (#12)" --body "Related to #12. Created by GitHub Actions with Cline CLI and VseLLM. Only two smoke-test files allowed. Do not merge. ChatGPT controller reviews this PR in scheduled task."
