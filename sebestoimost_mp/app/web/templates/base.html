<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БЛАГОМЕД — Себестоимость МП</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
header {
    background: #555; color: #fff; padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 1.4em; }
nav a {
    color: #fff; text-decoration: none; margin-left: 15px; font-size: 0.9em;
}
nav a:hover { text-decoration: underline; }
main { padding: 20px; max-width: 1100px; margin: 0 auto; }
.flash { padding: 10px; margin: 10px 0; border-radius: 4px; }
.flash-ok { background: #e6f4e6; color: #256b25; border: 1px solid #9ed39e; }
.flash-err { background: #fbe6e6; color: #8a2222; border: 1px solid #e0a3a3; }

table { border-collapse: collapse; width: 100%; margin: 10px 0; background: #fff; }
th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 0.9em; }
th { background: #eee; }

input, select, button { padding: 4px 6px; font-size: 0.9em; }
button { cursor: pointer; }
form.inline { display: inline-block; margin: 0 4px 4px 0; }

h1 { font-size: 1.3em; margin-bottom: 12px; }
h2 { font-size: 1.1em; margin: 16px 0 8px; }
section { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 12px; margin-bottom: 16px; }
.hint { color: #777; font-size: 0.8em; margin-top: 6px; }
.btn { display: inline-block; padding: 8px 16px; background: #555; color: #fff; text-decoration: none; border-radius: 4px; margin-right: 8px; }
.btn:hover { background: #333; }
</style>
</head>
<body>
<header>
    <h1>БЛАГОМЕД — Себестоимость МП</h1>
    <nav>
        <a href="{{ url_for('web.index') }}">Расчёт</a>
        <a href="{{ url_for('web.products') }}">Товары</a>
        <a href="{{ url_for('web.expenses') }}">Расходы</a>
        <a href="{{ url_for('web.problems') }}">Проблемные</a>
        <a href="{{ url_for('web.history') }}">История</a>
    </nav>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
