{% extends "base.html" %}
{% block content %}
<style>
  fieldset {
    border: 1px solid #888;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    margin: 0.5rem 0 0.2rem;
  }
</style>

<h1>Расчёт себестоимости</h1>

<form action="/upload" method="post" enctype="multipart/form-data">
  <fieldset>
    <legend>Файлы</legend>

    <label for="wb_file">Wildberries (.xlsx)</label>
    <input id="wb_file" type="file" name="wb_file" accept=".xlsx">

    <label for="ozon_file">Ozon (.xlsx)</label>
    <input id="ozon_file" type="file" name="ozon_file" accept=".xlsx">

    <label for="calc_date">Дата расчёта</label>
    <input id="calc_date" type="date" name="calc_date" value="{{ today }}">

    <button type="submit">Загрузить файлы</button>
  </fieldset>
</form>

<h2>Скачать заполненные файлы</h2>
<p><a href="/download/wb">Скачать WB</a></p>
<p><a href="/download/ozon">Скачать Ozon</a></p>
{% endblock %}
