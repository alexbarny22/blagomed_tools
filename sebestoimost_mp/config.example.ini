# Конфигурация подключения к 1С УТ 11.5 (только чтение).
# Скопировать в config.ini рядом с приложением и заполнить свои значения.
# config.ini НЕ коммитить (содержит пароль).

[1C]
# Режим подключения: com (V83.COMConnector, Windows) или odata (только справочник, цены не публикуются)
mode = com
# Сервер 1С и имя базы (как в строке подключения Srvr/Ref)
server =
base =
# Пользователь 1С с правами ЧТЕНИЯ
user =
password =
# Для режима odata можно задать URL явно:
# url_odata = http://server:4001/base/odata/standard.odata/

[Цены]
# Вид цены и поставщик — как в старом боте
вид_цены = Закупочная
поставщик = ГАВРЮШКИН
