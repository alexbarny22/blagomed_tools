; Настройки бота «Заказ поставщику из Excel»
; Сохраняйте файл в кодировке UTF-8 (Блокнот: Файл → Сохранить как → Кодировка UTF-8)

[1C]
; адрес публикации ut12 (как в боте для Ozon/WB)
url = http://91.199.149.224:4001/ut12
; пользователь 1С и его пароль (тот же, что в боте для Ozon/WB)
user = 
password =
timeout = 120

[ЗАКАЗ]
; часть наименования контрагента-поставщика
поставщик = ГАВРЮШКИН РУСЛАН НИКОЛАЕВИЧ
; точные наименования из 1С (если пусто — берётся из последнего заказа этому поставщику)
организация = ИП Липихин Александр Алексеевич
соглашение = Соглашение Гаврюшкин
договор = ДОГОВОР ГАВРЮШКИН Р.Н.
склад = склад Общий
; статус нового заказа: НеСогласован / Согласован / Подтвержден / КПоступлению
статус = Подтвержден
; дата поступления = дата заказа + столько месяцев
срок_поступления_мес = 1
; проводить документ (да/нет)
проводить = да
комментарий = Создан ботом из файла {file}

[PDF]
; куда сохранять PDF заказа (пусто = папка «Заказы» рядом с ботом)
папка =
; дополнительная копия, например папка Яндекс Диска (пусто = не копировать)
; пример: C:\Users\blago\YandexDisk\Заказы поставщикам
копия =
; открывать PDF сразу после создания (да/нет)
открывать = да

[MAX]
; текст, который бот скопирует после файла; {number} — номер заказа
текст = Заказ № {number}
; путь к программе МАКС, чтобы бот сам её открывал (пусто = поищет сам)
программа =
